<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Capital Chordsmen Email HTML Builder</title>
  <style>
    :root {
      --brand-burgundy: #7A1F2B;
      --brand-gold: #C9A646;
      --text-dark: #333333;
      --panel-border: #e3e3e3;
      --bg: #f7f4ef;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      color: var(--text-dark);
      background: var(--bg);
      line-height: 1.4;
    }

    .page {
      max-width: 1200px;
      margin: 0 auto;
      padding: 20px;
      display: grid;
      grid-template-columns: 420px 1fr;
      gap: 20px;
    }

    .panel, .preview-panel {
      background: #fff;
      border: 1px solid var(--panel-border);
      border-radius: 10px;
      padding: 18px;
      box-shadow: 0 3px 12px rgba(0, 0, 0, 0.05);
    }

    h1 { margin: 0 0 10px; color: var(--brand-burgundy); font-size: 1.5rem; }
    h2 { margin: 20px 0 8px; color: var(--brand-burgundy); font-size: 1rem; }

    .hint { font-size: 0.9rem; color: #5c5c5c; margin-bottom: 14px; }

    label { display: block; font-weight: bold; margin: 10px 0 6px; font-size: 0.9rem; }

    input[type="text"], textarea, select {
      width: 100%;
      border: 1px solid #cccccc;
      border-radius: 6px;
      padding: 8px;
      font-size: 0.9rem;
      font-family: inherit;
      background: #fff;
    }

    textarea { min-height: 70px; resize: vertical; }

    .row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

    .actions { display: flex; gap: 8px; margin-top: 16px; }

    button {
      border: 0;
      border-radius: 6px;
      background: var(--brand-burgundy);
      color: #fff;
      padding: 10px 12px;
      cursor: pointer;
      font-size: 0.9rem;
      font-weight: bold;
    }

    button.secondary { background: #6f6f6f; }

    #copyStatus { font-size: 0.85rem; color: #2f6f3e; margin-top: 8px; min-height: 1.2em; }

    iframe {
      width: 100%;
      min-height: 720px;
      border: 1px solid var(--panel-border);
      border-radius: 8px;
      background: #fff;
    }

    .output-wrap { margin-top: 14px; }

    #htmlOutput {
      width: 100%;
      min-height: 180px;
      font-family: "Courier New", Courier, monospace;
      font-size: 0.8rem;
      background: #fafafa;
    }

    @media (max-width: 980px) {
      .page { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <div class="page">
    <div class="panel">
      <h1>Capital Chordsmen Email Builder</h1>
      <p class="hint">Generate simple email-friendly HTML using Capital Chordsmen styling from the brand kit and examples.</p>

      <label for="emailType">Email Type</label>
      <select id="emailType">
        <option value="communique">Communique distribution email</option>
        <option value="newsletter">What's Happening! member newsletter</option>
      </select>

      <h2>Header Content</h2>
      <label for="subject">Subject</label>
      <input id="subject" type="text" placeholder="Example: Capital Chordsmen Communique" />

      <label for="preheader">Preheader</label>
      <input id="preheader" type="text" placeholder="Short preview text shown in inboxes" />

      <label for="headline">Headline</label>
      <input id="headline" type="text" placeholder="Main headline" />

      <label for="intro">Intro</label>
      <textarea id="intro" placeholder="Opening paragraph"></textarea>

      <h2>Body Sections</h2>
      <label for="section1">Section 1</label>
      <textarea id="section1" placeholder="Section content"></textarea>

      <label for="section2">Section 2</label>
      <textarea id="section2" placeholder="Section content"></textarea>

      <label for="section3">Section 3</label>
      <textarea id="section3" placeholder="Section content"></textarea>

      <h2>Call to Action</h2>
      <div class="row">
        <div>
          <label for="ctaText">CTA Text</label>
          <input id="ctaText" type="text" placeholder="Learn More" />
        </div>
        <div>
          <label for="ctaUrl">CTA URL</label>
          <input id="ctaUrl" type="text" placeholder="https://capitalchordsmen.com" />
        </div>
      </div>

      <h2>Footer</h2>
      <label for="footerNotes">Footer Notes</label>
      <textarea id="footerNotes" placeholder="Optional footer note"></textarea>

      <label for="unsubscribeUrl">Unsubscribe URL (Communique only)</label>
      <input id="unsubscribeUrl" type="text" placeholder="mailto:unsubscribe@capitalchordsmen.com" />

      <div class="actions">
        <button id="generateBtn">Generate HTML</button>
        <button id="copyBtn" class="secondary">Copy HTML</button>
      </div>
      <div id="copyStatus"></div>
    </div>

    <div class="preview-panel">
      <h2 style="margin-top:0;">Live Preview</h2>
      <iframe id="previewFrame" title="Email preview"></iframe>

      <div class="output-wrap">
        <h2>Generated HTML</h2>
        <textarea id="htmlOutput" readonly></textarea>
      </div>
    </div>
  </div>

  <script>
    const fields = {
      emailType: document.getElementById('emailType'),
      subject: document.getElementById('subject'),
      preheader: document.getElementById('preheader'),
      headline: document.getElementById('headline'),
      intro: document.getElementById('intro'),
      section1: document.getElementById('section1'),
      section2: document.getElementById('section2'),
      section3: document.getElementById('section3'),
      ctaText: document.getElementById('ctaText'),
      ctaUrl: document.getElementById('ctaUrl'),
      footerNotes: document.getElementById('footerNotes'),
      unsubscribeUrl: document.getElementById('unsubscribeUrl')
    };

    const htmlOutput = document.getElementById('htmlOutput');
    const previewFrame = document.getElementById('previewFrame');
    const copyStatus = document.getElementById('copyStatus');

    function esc(value) {
      return (value || '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;')
        .replace(/\n/g, '<br>');
    }

    function buildSection(text) {
      if (!text.trim()) return '';
      return `<tr><td style="padding:0 24px 16px;color:#333333;font-size:16px;line-height:1.5;">${esc(text)}</td></tr>`;
    }

    function buildEmailHtml() {
      const type = fields.emailType.value;
      const subject = fields.subject.value || (type === 'communique' ? 'Capital Chordsmen Communique' : "What’s Happening!");
      const preheader = fields.preheader.value || 'The Capital Chordsmen update';
      const headline = fields.headline.value || subject;
      const intro = fields.intro.value || 'Hello everyone,';
      const ctaText = fields.ctaText.value || 'Learn More';
      const ctaUrl = fields.ctaUrl.value || 'https://capitalchordsmen.com';
      const footerNotes = fields.footerNotes.value.trim();
      const unsubscribeUrl = fields.unsubscribeUrl.value.trim();

      const sectionHtml = [fields.section1.value, fields.section2.value, fields.section3.value]
        .map(buildSection)
        .join('');

      const optionalFooterNote = footerNotes
        ? `<p style="margin:12px 0 0 0;font-size:12px;color:#999999;">${esc(footerNotes)}</p>`
        : '';

      let unsubscribeBlock = '';
      if (type === 'communique') {
        const link = unsubscribeUrl || 'mailto:unsubscribe@capitalchordsmen.com?subject=Unsubscribe%20%E2%80%93%20Capital%20Chordsmen';
        unsubscribeBlock = `<p style="margin:10px 0 0 0;font-size:12px;color:#999999;"><a href="${esc(link)}" style="color:#999999;text-decoration:underline;">Unsubscribe from this list</a></p>`;
      }

      return `<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>${esc(subject)}</title>
</head>
<body style="margin:0;padding:0;background:#ffffff;font-family:Arial,Helvetica,sans-serif;color:#333333;line-height:1.5;">
  <div style="display:none;max-height:0;overflow:hidden;opacity:0;color:transparent;">${esc(preheader)}</div>
  <div style="text-align:center;padding:20px 0 10px 0;">
    <h1 style="margin:0;color:#7A1F2B;font-family:Georgia,serif;font-size:30px;">The Capital Chordsmen</h1>
    <p style="margin:6px 0 0 0;font-size:14px;color:#333333;">The Tallahassee Chapter of the Barbershop Harmony Society</p>
    <hr style="border:none;border-top:2px solid #C9A646;width:60%;margin:14px auto;">
  </div>

  <table role="presentation" cellpadding="0" cellspacing="0" width="100%">
    <tr>
      <td align="center">
        <table role="presentation" cellpadding="0" cellspacing="0" width="700" style="width:700px;max-width:700px;">
          <tr>
            <td style="padding:0 24px 12px;color:#7A1F2B;font-size:28px;line-height:1.2;font-weight:bold;">
              ${esc(headline)}
            </td>
          </tr>
          <tr>
            <td style="padding:0 24px 18px;color:#333333;font-size:16px;line-height:1.5;">
              ${esc(intro)}
            </td>
          </tr>
          ${sectionHtml}
          <tr>
            <td style="padding:12px 24px 24px;">
              <a href="${esc(ctaUrl)}" style="display:inline-block;background:#7A1F2B;color:#ffffff;padding:12px 20px;text-decoration:none;border-radius:4px;font-weight:bold;">
                ${esc(ctaText)}
              </a>
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>

  <div style="max-width:700px;margin:40px auto 20px auto;text-align:center;font-size:14px;color:#666666;">
    <hr style="border:none;border-top:1px solid #E5E5E5;margin-bottom:20px;">
    <p style="margin:5px 0;font-weight:bold;color:#7A1F2B;">The Capital Chordsmen</p>
    <p style="margin:5px 0;">The Tallahassee Chapter of the Barbershop Harmony Society</p>
    <p style="margin:12px 0;">
      <a href="https://capitalchordsmen.com" style="color:#7A1F2B;text-decoration:none;">Website</a>
      &nbsp;|&nbsp;
      <a href="https://www.facebook.com/thecapitalchordsmen/" style="color:#7A1F2B;text-decoration:none;">Facebook</a>
      &nbsp;|&nbsp;
      <a href="https://www.instagram.com/tallybhs" style="color:#7A1F2B;text-decoration:none;">Instagram</a>
      &nbsp;|&nbsp;
      <a href="https://x.com/tallybhs" style="color:#7A1F2B;text-decoration:none;">X</a>
    </p>
    ${optionalFooterNote}
    ${unsubscribeBlock}
  </div>
</body>
</html>`;
    }

    function render() {
      const html = buildEmailHtml();
      htmlOutput.value = html;
      previewFrame.srcdoc = html;
    }

    document.getElementById('generateBtn').addEventListener('click', render);

    document.getElementById('copyBtn').addEventListener('click', async () => {
      try {
        await navigator.clipboard.writeText(htmlOutput.value);
        copyStatus.textContent = 'HTML copied to clipboard.';
      } catch (error) {
        copyStatus.textContent = 'Copy failed. Select and copy from the text area manually.';
      }
    });

    Object.values(fields).forEach((field) => {
      field.addEventListener('input', render);
      field.addEventListener('change', render);
    });

    fields.subject.value = 'Capital Chordsmen Communique';
    fields.preheader.value = 'Chapter updates and announcements';
    fields.headline.value = 'Capital Chordsmen Update';
    fields.intro.value = 'Hello everyone,';
    fields.section1.value = '';
    fields.section2.value = '';
    fields.section3.value = '';
    fields.ctaText.value = 'Learn More';
    fields.ctaUrl.value = 'https://capitalchordsmen.com';
    fields.footerNotes.value = '';
    fields.unsubscribeUrl.value = '';

    render();
  </script>
</body>
</html>
